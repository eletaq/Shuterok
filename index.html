<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Shuterok — Движок</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#000;font-family:monospace;-webkit-user-select:none;user-select:none;touch-action:none}
  
  #wrap{position:relative;height:100vh;width:100vw;overflow:hidden;background:#000}
  canvas{display:block;width:100%;height:100%;background:#1a1c20;touch-action:none;cursor:none}
  
  #fireBtn{
    position:absolute;
    z-index:100;
    width:72px;
    height:72px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #ff6b35, #cc0000);
    box-shadow:0 8px 32px rgba(255,0,0,0.4), inset 0 -4px 12px rgba(0,0,0,0.3);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-weight:900;
    font-size:12px;
    border:3px solid rgba(255,255,255,0.15);
    touch-action:none;
    transition:transform 0.1s;
    text-transform:uppercase;
    letter-spacing:1px;
  }
  #fireBtn:active{transform:scale(0.85)}
  
  #debugBtn{
    position:absolute;
    left:12px;
    top:12px;
    z-index:100;
    width:40px;
    height:40px;
    border-radius:10px;
    background:rgba(0,0,0,0.7);
    backdrop-filter:blur(8px);
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(255,255,255,0.08);
    color:#fff;
    font-size:18px;
    transition:transform 0.2s;
    cursor:pointer;
  }
  #debugBtn:active{transform:scale(0.9)}
  
  #debugOverlay{
    position:absolute;
    top:58px;
    left:12px;
    z-index:300;
    display:none;
    background:rgba(0,0,0,0.92);
    backdrop-filter:blur(12px);
    border-radius:10px;
    border:1px solid rgba(79,195,247,0.15);
    padding:10px 12px;
    min-width:160px;
    max-width:min(340px, 70vw);
    max-height:60vh;
    overflow-y:auto;
    pointer-events:auto;
    box-shadow:0 8px 32px rgba(0,0,0,0.9);
    font-size:11px;
    line-height:1.5;
    color:#b0d0e8;
  }
  #debugOverlay.active{display:block}
  
  #debugPanel .head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:5px;
    padding-bottom:4px;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  #debugPanel .head h3{
    color:#4fc3f7;
    font-size:12px;
    margin:0;
    font-family:system-ui;
  }
  #debugPanel .head button{
    background:rgba(255,255,255,0.05);
    border:none;
    color:#8aaccc;
    padding:1px 6px;
    border-radius:4px;
    cursor:pointer;
    font-size:10px;
    font-family:system-ui;
  }
  #debugPanel .head button:hover{background:rgba(255,255,255,0.1)}
  
  #debugContent .lbl{color:#4fc3f7}
  #debugContent .val{color:#ffd97a}
  #debugContent .warn{color:#ffa94d}
  #debugContent .err{color:#ff6b6b}
  #debugContent .ok{color:#69db7c}
  #debugContent .section{
    color:#fff;
    font-weight:700;
    margin-top:5px;
    display:block;
    border-top:1px solid rgba(255,255,255,0.04);
    padding-top:4px;
  }
  #debugContent .sub{margin-left:10px;display:block}
  #debugContent .error-log{
    background:rgba(255,0,0,0.06);
    border-left:2px solid #ff6b6b;
    padding:2px 6px;
    margin:2px 0;
    border-radius:3px;
    font-size:9px;
  }
  
  #hudDebug{
    position:absolute;
    bottom:80px;
    left:12px;
    z-index:50;
    color:#0f0;
    font-family:monospace;
    font-size:11px;
    background:rgba(0,0,0,0.7);
    padding:6px 10px;
    border-radius:6px;
    border:1px solid rgba(0,255,0,0.2);
    pointer-events:none;
    line-height:1.4;
    max-width:200px;
  }
  #hudDebug .label{color:#4fc3f7}
  #hudDebug .value{color:#ffd97a}
  #hudDebug .err{color:#ff6b6b}
  
  @media(max-width:600px){
    #debugOverlay{
      top:54px;
      left:8px;
      padding:8px 10px;
      min-width:120px;
      max-width:min(260px, 65vw);
      max-height:50vh;
      font-size:10px;
    }
    #debugPanel .head h3{font-size:10px}
    #debugContent .sub{margin-left:6px}
    #debugBtn{width:34px;height:34px;font-size:16px;left:8px;top:8px}
    #fireBtn{width:60px;height:60px;font-size:10px}
    #hudDebug{font-size:9px;padding:4px 8px;bottom:70px;left:8px;max-width:150px}
  }
  
  @media(max-width:400px){
    #debugOverlay{
      top:48px;
      left:6px;
      padding:6px 8px;
      min-width:100px;
      max-width:min(200px, 60vw);
      max-height:45vh;
      font-size:9px;
    }
    #debugPanel .head h3{font-size:9px}
    #debugContent .section{margin-top:3px;padding-top:3px}
    #debugContent .sub{margin-left:4px}
    #debugBtn{width:30px;height:30px;font-size:14px;left:6px;top:6px}
    #fireBtn{width:52px;height:52px;font-size:9px}
    #hudDebug{font-size:8px;padding:3px 6px;bottom:60px;left:6px;max-width:120px}
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  
  <div id="fireBtn">FIRE</div>
  <div id="debugBtn">🐛</div>
  
  <div id="hudDebug">
    <span class="label">Дист:</span> <span class="value" id="debugDist">0.00</span><br>
    <span class="label">Клетка:</span> <span class="value" id="debugCell">-</span>
  </div>
  
  <div id="debugOverlay">
    <div id="debugPanel">
      <div class="head">
        <h3>🐛 Отладка</h3>
        <div>
          <button id="debugClear">✕</button>
          <button id="debugClose">Закрыть</button>
        </div>
      </div>
      <div id="debugContent"></div>
    </div>
  </div>
</div>

<script>
// ============================================================
// 1. ПЕРЕХВАТ ОШИБОК
// ============================================================
const errorLog = [];
let debugActive = false;

function logError(source, message, data = null){
  const entry = {
    time: new Date().toLocaleTimeString(),
    source: source,
    message: message,
    data: data ? JSON.stringify(data).slice(0, 80) : null,
    id: Date.now()
  };
  errorLog.push(entry);
  if(errorLog.length > 30) errorLog.shift();
  console.error(`[${source}] ${message}`, data || '');
  if(debugActive) updateDebug();
}

window.addEventListener('error', (e) => {
  logError('GLOBAL', e.message || 'Unknown', {filename: e.filename, lineno: e.lineno});
  return false;
});

window.addEventListener('unhandledrejection', (e) => {
  logError('PROMISE', e.reason?.message || 'Unhandled rejection', e.reason);
});

// ============================================================
// 2. CANVAS
// ============================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
let DPR = 1;

function resizeCanvas(){
  try{
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
    
    const quality = (W < 500 || H < 500) ? 0.7 : 0.9;
    canvas.width = Math.max(300, Math.floor(W * DPR * quality));
    canvas.height = Math.max(200, Math.floor(H * DPR * quality));
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }catch(e){
    logError('CANVAS', 'Ошибка ресайза', e.message);
  }
}

canvas.addEventListener('contextmenu', e => e.preventDefault());

// ============================================================
// 3. КАРТА 12×12
// ============================================================
class Map{
  constructor(size = 12){
    this.size = size;
    this.grid = [];
    this.generate();
  }
  
  generate(){
    const s = this.size;
    this.grid = Array(s * s).fill(1);
    
    for(let i = 2; i < 10; i++){
      for(let j = 2; j < 10; j++){
        this.grid[j * s + i] = 0;
      }
    }
    
    this.grid[4 * s + 4] = 1;
    this.grid[4 * s + 7] = 1;
    this.grid[7 * s + 4] = 1;
    this.grid[7 * s + 7] = 1;
    this.grid[3 * s + 5] = 1;
    this.grid[3 * s + 6] = 1;
    this.grid[8 * s + 5] = 1;
    this.grid[8 * s + 6] = 1;
    this.grid[5 * s + 3] = 1;
    this.grid[6 * s + 3] = 1;
    this.grid[5 * s + 8] = 1;
    this.grid[6 * s + 8] = 1;
  }
  
  at(x, y){
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    if(xi < 0 || xi >= this.size || yi < 0 || yi >= this.size) return 1;
    return this.grid[yi * this.size + xi];
  }
  
  isWall(x, y){
    return this.at(x, y) === 1;
  }
}

// ============================================================
// 4. ИГРОК
// ============================================================
class Player{
  constructor(x, y){
    this.x = x;
    this.y = y;
    this.ang = 0;
    this.fov = Math.PI / 3;
    this.speed = 3.5;
    this.turnSpeed = 2.8;
    this.radius = 0.2;
  }
  
  get dir(){
    return {x: Math.cos(this.ang), y: Math.sin(this.ang)};
  }
  
  move(dx, dy, map){
    const nx = this.x + dx;
    const ny = this.y + dy;
    const r = this.radius;
    
    let canX = true;
    for(let i = -r; i <= r; i += r/2){
      if(map.isWall(nx + i, this.y)) { canX = false; break; }
    }
    if(canX) this.x = nx;
    
    let canY = true;
    for(let i = -r; i <= r; i += r/2){
      if(map.isWall(this.x, ny + i)) { canY = false; break; }
    }
    if(canY) this.y = ny;
  }
}

// ============================================================
// 5. РЕЙКАСТИНГ
// ============================================================
function castRay(px, py, ang, map){
  const dx = Math.cos(ang);
  const dy = Math.sin(ang);
  
  let x = px;
  let y = py;
  
  const step = 0.01;
  let dist = 0;
  let hit = false;
  let side = 0;
  let wallX = 0;
  
  while(!hit && dist < 25){
    x += dx * step;
    y += dy * step;
    dist += step;
    
    if(map.isWall(x, y)){
      hit = true;
      const cx = Math.floor(x);
      const cy = Math.floor(y);
      const fx = x - cx;
      const fy = y - cy;
      if(fx < 0.1 || fx > 0.9) side = 0;
      else side = 1;
      wallX = side === 0 ? fy : fx;
    }
  }
  
  if(!hit){
    dist = 25;
    wallX = 0.5;
  }
  
  return {distance: dist, side, wallX};
}

// ============================================================
// 6. УПРАВЛЕНИЕ (СТИК СЛЕДУЕТ ЗА ПАЛЬЦЕМ)
// ============================================================
const stick = {
  id: null,
  cx: 0, cy: 0,
  radius: 60,
  kx: 0, ky: 0,
  pressed: false,
  startX: 0,
  startY: 0
};

const look = {
  id: null,
  lastX: 0,
  active: false
};

let move = {f: 0, s: 0};

function resetStick(){
  // Сброс в дефолтную позицию (только при потере касания)
  const c = getDefaultStickCenter();
  stick.cx = c.x;
  stick.cy = c.y;
  stick.radius = Math.min(Math.min(W, H) * 0.18, Math.max(35, Math.min(W, H) * 0.22));
  stick.kx = stick.cx;
  stick.ky = stick.cy;
  stick.startX = stick.cx;
  stick.startY = stick.cy;
  move.f = 0;
  move.s = 0;
}

function getDefaultStickCenter(){
  const rect = canvas.getBoundingClientRect();
  if(!rect) return {x: W * 0.12, y: H * 0.78};
  return {
    x: Math.round(Math.max(0.04, Math.min(0.96, 0.12)) * rect.width),
    y: Math.round(Math.max(0.04, Math.min(0.96, 0.78)) * rect.height)
  };
}

function updateStick(clientX, clientY){
  const max = stick.radius;
  
  let dx = clientX - stick.startX;
  let dy = clientY - stick.startY;
  let dist = Math.hypot(dx, dy);
  
  // Если палец далеко — двигаем центр стика за пальцем (с плавностью)
  if(dist > max){
    stick.cx = stick.startX + dx * 0.5;
    stick.cy = stick.startY + dy * 0.5;
    dx = clientX - stick.cx;
    dy = clientY - stick.cy;
    dist = Math.hypot(dx, dy);
  }
  
  const dead = max * 0.06;
  if(dist < dead){
    stick.kx = stick.cx;
    stick.ky = stick.cy;
    move.f = 0;
    move.s = 0;
    return;
  }
  
  if(dist > max){
    dx = dx / dist * max;
    dy = dy / dist * max;
    dist = max;
  }
  
  stick.kx = stick.cx + dx;
  stick.ky = stick.cy + dy;
  
  const factor = (dist - dead) / (max - dead);
  const angle = Math.atan2(dy, dx);
  
  move.f = -Math.sin(angle) * factor;
  move.s = Math.cos(angle) * factor;
}

// ============================================================
// 7. ВВОД
// ============================================================
function setupInput(){
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onCancel);
}

function onDown(e){
  if(e.pointerType === 'mouse') return;
  
  const x = e.clientX;
  const y = e.clientY;
  
  const fb = document.getElementById('fireBtn').getBoundingClientRect();
  if(x >= fb.left && x <= fb.right && y >= fb.top && y <= fb.bottom) return;
  
  const isLeft = x < W * 0.5;
  
  if(isLeft && stick.id === null){
    stick.id = e.pointerId;
    stick.pressed = true;
    // ============================================================
    // ЦЕНТР СТИКА = ПОЗИЦИЯ ПАЛЬЦА
    // ============================================================
    stick.cx = x;
    stick.cy = y;
    stick.startX = x;
    stick.startY = y;
    stick.radius = Math.min(Math.min(W, H) * 0.18, Math.max(35, Math.min(W, H) * 0.22));
    updateStick(x, y);
    try{canvas.setPointerCapture(e.pointerId);}catch(_){}
    return;
  }
  
  if(!isLeft && look.id === null){
    look.id = e.pointerId;
    look.lastX = x;
    look.active = true;
    try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  }
}

function onMove(e){
  if(e.pointerType === 'mouse') return;
  
  const x = e.clientX;
  const y = e.clientY;
  
  if(e.pointerId === stick.id && stick.pressed){
    updateStick(x, y);
    return;
  }
  
  if(e.pointerId === look.id && look.active){
    const dx = x - look.lastX;
    look.lastX = x;
    const maxTurn = Math.PI / 5;
    let turn = dx * (Math.PI * 0.7 / W);
    turn = Math.min(maxTurn, Math.max(-maxTurn, turn));
    player.ang += turn;
  }
}

function onUp(e){
  if(e.pointerType === 'mouse') return;
  
  if(e.pointerId === stick.id){
    stick.id = null;
    stick.pressed = false;
    move.f = 0;
    move.s = 0;
    // Возвращаем стик в дефолтную позицию
    const c = getDefaultStickCenter();
    stick.cx = c.x;
    stick.cy = c.y;
    stick.kx = stick.cx;
    stick.ky = stick.cy;
    try{canvas.releasePointerCapture(e.pointerId);}catch(_){}
  }
  
  if(e.pointerId === look.id){
    look.id = null;
    look.active = false;
    try{canvas.releasePointerCapture(e.pointerId);}catch(_){}
  }
}

function onCancel(e){ onUp(e); }

// ============================================================
// 8. ОТЛАДКА
// ============================================================
document.getElementById('debugBtn').addEventListener('click', ()=>{
  debugActive = !debugActive;
  document.getElementById('debugOverlay').classList.toggle('active', debugActive);
  if(debugActive) updateDebug();
});

document.getElementById('debugClose').addEventListener('click', ()=>{
  debugActive = false;
  document.getElementById('debugOverlay').classList.remove('active');
});

document.getElementById('debugClear').addEventListener('click', ()=>{
  errorLog.length = 0;
  updateDebug();
});

function updateDebug(){
  try{
    const el = document.getElementById('debugContent');
    const fps = lastTime > 0 ? Math.round(1000 / (performance.now() - lastTime)) : 0;
    const mem = performance.memory ? (performance.memory.usedJSHeapSize / 1048576).toFixed(1) : 'N/A';
    const aspect = (W / H).toFixed(2);
    
    let ang = player.ang * 180 / Math.PI;
    while(ang > 180) ang -= 360;
    while(ang < -180) ang += 360;
    
    let html = '';
    
    html += `<span class="section">📊 СИСТЕМА</span>`;
    html += `<span class="sub"><span class="lbl">FPS</span> → <span class="val ${fps < 20 ? 'err' : ''}">${fps}</span></span>`;
    html += `<span class="sub"><span class="lbl">Память</span> → <span class="val">${mem} MB</span></span>`;
    html += `<span class="sub"><span class="lbl">Время</span> → <span class="val">${uptime.toFixed(1)}с</span></span>`;
    html += `<span class="sub"><span class="lbl">Canvas</span> → <span class="val">${canvas.width}×${canvas.height}</span></span>`;
    html += `<span class="sub"><span class="lbl">Экран</span> → <span class="val">${W}×${H} (${aspect})</span></span>`;
    
    html += `<span class="section">🗺️ МИР</span>`;
    html += `<span class="sub"><span class="lbl">Размер</span> → <span class="val">${map.size}×${map.size}</span></span>`;
    html += `<span class="sub"><span class="lbl">Стен</span> → <span class="val">${map.grid ? map.grid.filter(c => c === 1).length : 0}</span></span>`;
    
    html += `<span class="section">🎮 ИГРОК</span>`;
    html += `<span class="sub"><span class="lbl">Позиция</span> → <span class="val">(${player.x.toFixed(2)}, ${player.y.toFixed(2)})</span></span>`;
    html += `<span class="sub"><span class="lbl">Угол</span> → <span class="val">${ang.toFixed(1)}°</span></span>`;
    html += `<span class="sub"><span class="lbl">В стене</span> → <span class="${map.isWall(player.x, player.y) ? 'err' : 'ok'}">${map.isWall(player.x, player.y) ? '❌ ДА' : '✅ НЕТ'}</span></span>`;
    html += `<span class="sub"><span class="lbl">FOV</span> → <span class="val">${(player.fov * 180 / Math.PI).toFixed(1)}°</span></span>`;
    
    html += `<span class="section">🎮 УПРАВЛЕНИЕ</span>`;
    html += `<span class="sub"><span class="lbl">Стик</span> → <span class="${stick.pressed ? 'ok' : ''}">${stick.pressed ? '✅ АКТИВЕН' : 'неактивен'}</span></span>`;
    html += `<span class="sub"><span class="lbl">Обзор</span> → <span class="${look.active ? 'ok' : ''}">${look.active ? '✅ АКТИВЕН' : 'неактивен'}</span></span>`;
    html += `<span class="sub"><span class="lbl">Движение</span> → <span class="val">F:${move.f.toFixed(2)} S:${move.s.toFixed(2)}</span></span>`;
    html += `<span class="sub"><span class="lbl">Центр стика</span> → <span class="val">(${stick.cx.toFixed(0)}, ${stick.cy.toFixed(0)})</span></span>`;
    
    html += `<span class="section">📏 ДИСТАНЦИЯ</span>`;
    html += `<span class="sub"><span class="lbl">До стены</span> → <span class="val ${debugWallDist >= 24 ? 'err' : ''}">${debugWallDist.toFixed(3)}</span></span>`;
    html += `<span class="sub"><span class="lbl">Клетка</span> → <span class="val">(${debugCellX}, ${debugCellY})</span></span>`;
    
    if(errorLog.length > 0){
      html += `<span class="section">🐛 ЛОГ ОШИБОК (${errorLog.length})</span>`;
      const lastErrors = errorLog.slice(-10);
      for(const e of lastErrors){
        html += `<div class="error-log">`;
        html += `<span class="time">[${e.time}]</span> `;
        html += `<span class="err">${e.source}</span> → `;
        html += `<span>${e.message}</span>`;
        html += `</div>`;
      }
    }
    
    el.innerHTML = html;
  }catch(e){
    document.getElementById('debugContent').textContent = 'Ошибка: ' + e.message;
  }
}

// ============================================================
// 9. РЕНДЕРИНГ
// ============================================================
let debugWallDist = 0;
let debugCellX = 0;
let debugCellY = 0;

function render(){
  try{
    const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = data.data;
    
    // Пол и потолок
    const half = canvas.height / 2;
    for(let y = 0; y < canvas.height; y++){
      const isC = y < half;
      const t = isC ? y / half : (y - half) / half;
      const brightness = isC ? 0.25 + t * 0.5 : 0.1 + t * 0.4;
      const r = isC ? Math.floor(50 * brightness) : Math.floor(30 * brightness);
      const g = isC ? Math.floor(60 * brightness) : Math.floor(40 * brightness);
      const bl = isC ? Math.floor(90 * brightness) : Math.floor(60 * brightness);
      
      for(let x = 0; x < canvas.width; x++){
        const idx = (y * canvas.width + x) * 4;
        d[idx] = r;
        d[idx+1] = g;
        d[idx+2] = bl;
        d[idx+3] = 255;
      }
    }
    
    // Стены
    const cols = Math.floor(canvas.width * 0.9);
    const step = player.fov / cols;
    let ang = player.ang - player.fov / 2;
    
    const wallData = [];
    
    for(let i = 0; i < cols; i++){
      const ray = castRay(player.x, player.y, ang, map);
      
      if(i === Math.floor(cols/2)){
        debugWallDist = ray.distance;
        const ddx = Math.cos(ang);
        const ddy = Math.sin(ang);
        debugCellX = Math.floor(player.x + ddx * ray.distance);
        debugCellY = Math.floor(player.y + ddy * ray.distance);
      }
      
      let cd = ray.distance * Math.cos(ang - player.ang);
      if(cd < 0.01) cd = 0.01;
      
      const h = Math.min(canvas.height * 2.5, canvas.height / (cd * 0.6 + 0.01));
      const yTop = (canvas.height - h) / 2;
      const yBottom = (canvas.height + h) / 2;
      
      const shade = Math.max(0.2, Math.min(1, 1.5 - cd * 0.05));
      
      const base = [140, 130, 120];
      const r = Math.floor(base[0] * shade);
      const g = Math.floor(base[1] * shade);
      const bl = Math.floor(base[2] * shade);
      
      const x = Math.floor((i / cols) * canvas.width);
      const nextX = Math.floor(((i + 1) / cols) * canvas.width);
      const width = Math.max(1, nextX - x);
      
      const ys = Math.max(0, Math.floor(yTop));
      const ye = Math.min(canvas.height - 1, Math.floor(yBottom));
      
      wallData.push({
        x, width, ys, ye,
        yTop, yBottom
      });
      
      for(let dx = 0; dx < width; dx++){
        const px = x + dx;
        if(px >= canvas.width) break;
        for(let y = ys; y <= ye; y++){
          const idx = (y * canvas.width + px) * 4;
          d[idx] = r;
          d[idx+1] = g;
          d[idx+2] = bl;
          d[idx+3] = 255;
        }
      }
      
      ang += step;
    }
    
    // Белые границы
    const lineColor = [255, 255, 255];
    const lineThickness = 2;
    
    for(let i = 0; i < wallData.length; i++){
      const w = wallData[i];
      
      for(let dx = 0; dx < w.width; dx++){
        const px = w.x + dx;
        if(px >= canvas.width) break;
        
        const floorY = Math.floor(w.yBottom);
        for(let t = 0; t < lineThickness; t++){
          const y = floorY - t;
          if(y >= 0 && y < canvas.height){
            const idx = (y * canvas.width + px) * 4;
            d[idx] = lineColor[0];
            d[idx+1] = lineColor[1];
            d[idx+2] = lineColor[2];
            d[idx+3] = 255;
          }
        }
        
        const ceilY = Math.floor(w.yTop);
        for(let t = 0; t < lineThickness; t++){
          const y = ceilY + t;
          if(y >= 0 && y < canvas.height){
            const idx = (y * canvas.width + px) * 4;
            d[idx] = lineColor[0];
            d[idx+1] = lineColor[1];
            d[idx+2] = lineColor[2];
            d[idx+3] = 255;
          }
        }
      }
    }
    
    document.getElementById('debugDist').textContent = debugWallDist.toFixed(3);
    document.getElementById('debugCell').textContent = `(${debugCellX}, ${debugCellY})`;
    
    drawDebugRay(d);
    drawMinimap(d);
    drawCrosshair(d);
    drawStick(d);
    
    ctx.putImageData(data, 0, 0);
  }catch(e){
    logError('RENDER', 'Ошибка', e.message);
  }
}

// ============================================================
// 10. ВИЗУАЛИЗАЦИЯ ЛУЧА
// ============================================================
function drawDebugRay(d){
  try{
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    
    const rayLen = Math.min(canvas.width * 0.4, 80 + debugWallDist * 10);
    const ang = player.ang;
    const ex = cx + Math.cos(ang) * rayLen;
    const ey = cy + Math.sin(ang) * rayLen;
    
    const steps = Math.max(10, Math.hypot(ex - cx, ey - cy));
    for(let t = 0; t <= 1; t += 1/steps){
      const lx = Math.floor(cx + (ex - cx) * t);
      const ly = Math.floor(cy + (ey - cy) * t);
      if(lx < 0 || lx >= canvas.width || ly < 0 || ly >= canvas.height) continue;
      const idx = (ly * canvas.width + lx) * 4;
      if(idx >= 0 && idx < d.length - 4){
        d[idx] = 0; d[idx+1] = 255; d[idx+2] = 0; d[idx+3] = 200;
      }
    }
  }catch(e){}
}

// ============================================================
// 11. МИНИ-КАРТА
// ============================================================
function drawMinimap(d){
  try{
    const s = Math.min(Math.max(80, canvas.width * 0.18), 160);
    const p = 8;
    const x = canvas.width - s - p;
    const y = p;
    const cell = (s - 4) / map.size;
    
    for(let j = 0; j < s; j++){
      for(let i = 0; i < s; i++){
        const px = Math.floor(x + i);
        const py = Math.floor(y + j);
        if(px < 0 || px >= canvas.width || py < 0 || py >= canvas.height) continue;
        const idx = (py * canvas.width + px) * 4;
        d[idx] = 10; d[idx+1] = 12; d[idx+2] = 18; d[idx+3] = 220;
      }
    }
    
    for(let my = 0; my < map.size; my++){
      for(let mx = 0; mx < map.size; mx++){
        if(map.at(mx, my) === 1){
          const px = Math.floor(x + 2 + mx * cell);
          const py = Math.floor(y + 2 + my * cell);
          const w = Math.ceil(cell);
          const h = Math.ceil(cell);
          for(let j = 0; j < h; j++){
            for(let i = 0; i < w; i++){
              const idx = ((py + j) * canvas.width + px + i) * 4;
              if(idx >= 0 && idx < d.length - 4){
                d[idx] = 200; d[idx+1] = 200; d[idx+2] = 200; d[idx+3] = 255;
              }
            }
          }
        }
      }
    }
    
    const px = Math.floor(x + 2 + player.x * cell);
    const py = Math.floor(y + 2 + player.y * cell);
    const pr = Math.max(3, cell * 0.5);
    
    for(let j = -pr; j <= pr; j++){
      for(let i = -pr; i <= pr; i++){
        if(Math.hypot(i, j) > pr) continue;
        const idx = ((py + j) * canvas.width + px + i) * 4;
        if(idx >= 0 && idx < d.length - 4){
          d[idx] = 0; d[idx+1] = 255; d[idx+2] = 0; d[idx+3] = 255;
        }
      }
    }
    
    const dl = cell * 1.8;
    const ex = px + Math.cos(player.ang) * dl;
    const ey = py + Math.sin(player.ang) * dl;
    const steps = Math.max(10, Math.hypot(ex - px, ey - py));
    for(let t = 0; t <= 1; t += 1/steps){
      const lx = Math.floor(px + (ex - px) * t);
      const ly = Math.floor(py + (ey - py) * t);
      if(lx < 0 || lx >= canvas.width || ly < 0 || ly >= canvas.height) continue;
      const idx = (ly * canvas.width + lx) * 4;
      if(idx >= 0 && idx < d.length - 4){
        d[idx] = 255; d[idx+1] = 80; d[idx+2] = 80; d[idx+3] = 255;
      }
    }
    
    for(let i = 0; i < s; i++){
      const idx1 = ((Math.floor(y)) * canvas.width + Math.floor(x) + i) * 4;
      const idx2 = ((Math.floor(y) + s - 1) * canvas.width + Math.floor(x) + i) * 4;
      const idx3 = ((Math.floor(y) + i) * canvas.width + Math.floor(x)) * 4;
      const idx4 = ((Math.floor(y) + i) * canvas.width + Math.floor(x) + s - 1) * 4;
      if(idx1 >= 0 && idx1 < d.length - 4){
        d[idx1] = 80; d[idx1+1] = 80; d[idx1+2] = 80; d[idx1+3] = 255;
        d[idx2] = 80; d[idx2+1] = 80; d[idx2+2] = 80; d[idx2+3] = 255;
        d[idx3] = 80; d[idx3+1] = 80; d[idx3+2] = 80; d[idx3+3] = 255;
        d[idx4] = 80; d[idx4+1] = 80; d[idx4+2] = 80; d[idx4+3] = 255;
      }
    }
  }catch(e){}
}

// ============================================================
// 12. ПРИЦЕЛ
// ============================================================
function drawCrosshair(d){
  try{
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const size = Math.max(10, canvas.width * 0.025);
    const gap = Math.max(4, size * 0.3);
    
    function line(x1, y1, x2, y2){
      const steps = Math.max(1, Math.hypot(x2 - x1, y2 - y1));
      for(let t = 0; t <= 1; t += 1/steps){
        const lx = Math.floor(x1 + (x2 - x1) * t);
        const ly = Math.floor(y1 + (y2 - y1) * t);
        if(lx < 0 || lx >= canvas.width || ly < 0 || ly >= canvas.height) continue;
        const idx = (ly * canvas.width + lx) * 4;
        d[idx] = 255; d[idx+1] = 50; d[idx+2] = 50; d[idx+3] = 255;
      }
    }
    
    const segs = [[-size,0,-gap,0],[gap,0,size,0],[0,-size,0,-gap],[0,gap,0,size]];
    for(const s of segs){
      line(cx + s[0], cy + s[1], cx + s[2], cy + s[3]);
    }
    for(let dy = -1; dy <= 1; dy++){
      for(let dx = -1; dx <= 1; dx++){
        const idx = ((cy + dy) * canvas.width + cx + dx) * 4;
        if(idx >= 0 && idx < d.length - 4){
          d[idx] = 255; d[idx+1] = 0; d[idx+2] = 0; d[idx+3] = 255;
        }
      }
    }
  }catch(e){}
}

// ============================================================
// 13. ДЖОЙСТИК
// ============================================================
function drawStick(d){
  try{
    const cx = stick.cx;
    const cy = stick.cy;
    const r = stick.radius;
    const kx = stick.kx;
    const ky = stick.ky;
    
    const alpha = stick.pressed ? 180 : 80;
    for(let dy = -r*1.2; dy <= r*1.2; dy++){
      for(let dx = -r*1.2; dx <= r*1.2; dx++){
        if(Math.hypot(dx, dy) > r*1.2) continue;
        const px = Math.floor(cx + dx);
        const py = Math.floor(cy + dy);
        if(px < 0 || px >= canvas.width || py < 0 || py >= canvas.height) continue;
        const idx = (py * canvas.width + px) * 4;
        d[idx] = 30; d[idx+1] = 40; d[idx+2] = 60; d[idx+3] = alpha;
      }
    }
    
    for(let dy = -r; dy <= r; dy++){
      for(let dx = -r; dx <= r; dx++){
        const dist = Math.hypot(dx, dy);
        if(dist > r - 1 && dist < r + 1){
          const px = Math.floor(cx + dx);
          const py = Math.floor(cy + dy);
          if(px < 0 || px >= canvas.width || py < 0 || py >= canvas.height) continue;
          const idx = (py * canvas.width + px) * 4;
          d[idx] = 80; d[idx+1] = 100; d[idx+2] = 140; d[idx+3] = alpha;
        }
      }
    }
    
    const kr = Math.max(12, r * 0.3);
    const handleX = stick.pressed ? kx : cx;
    const handleY = stick.pressed ? ky : cy;
    
    for(let dy = -kr; dy <= kr; dy++){
      for(let dx = -kr; dx <= kr; dx++){
        if(Math.hypot(dx, dy) > kr) continue;
        const px = Math.floor(handleX + dx);
        const py = Math.floor(handleY + dy);
        if(px < 0 || px >= canvas.width || py < 0 || py >= canvas.height) continue;
        const idx = (py * canvas.width + px) * 4;
        if(stick.pressed){
          d[idx] = 255; d[idx+1] = 100; d[idx+2] = 100; d[idx+3] = 255;
        }else{
          d[idx] = 150; d[idx+1] = 150; d[idx+2] = 180; d[idx+3] = 150;
        }
      }
    }
  }catch(e){}
}

// ============================================================
// 14. КНОПКА FIRE
// ============================================================
function updateFireBtn(){
  try{
    const btn = document.getElementById('fireBtn');
    const s = Math.min(72, Math.max(52, Math.min(W, H) * 0.1));
    const px = Math.round(Math.max(0.04, Math.min(0.96, 0.92)) * W);
    const py = Math.round(Math.max(0.04, Math.min(0.96, 0.78)) * H);
    btn.style.width = s + 'px';
    btn.style.height = s + 'px';
    btn.style.left = (px - s / 2) + 'px';
    btn.style.top = (py - s / 2) + 'px';
    btn.style.fontSize = Math.max(10, s * 0.2) + 'px';
  }catch(e){
    logError('UI', 'Ошибка кнопки огня', e.message);
  }
}

// ============================================================
// 15. ОБНОВЛЕНИЕ
// ============================================================
let lastTime = 0;
let frame = 0;
let uptime = 0;

function update(dt){
  try{
    uptime += dt;
    
    const ms = player.speed * 1.0;
    const forward = move.f * ms * dt;
    const strafe = move.s * ms * dt * 0.8;
    
    if(forward !== 0 || strafe !== 0){
      const a = player.ang;
      const dx = Math.cos(a) * forward - Math.sin(a) * strafe;
      const dy = Math.sin(a) * forward + Math.cos(a) * strafe;
      if(isFinite(dx) && isFinite(dy)){
        player.move(dx, dy, map);
      }
    }
    
    frame++;
  }catch(e){
    logError('UPDATE', 'Ошибка', e.message);
  }
}

// ============================================================
// 16. ГЛАВНЫЙ ЦИКЛ
// ============================================================
function loop(time){
  try{
    if(!lastTime) lastTime = time;
    const dt = Math.min(0.05, (time - lastTime) / 1000);
    lastTime = time;
    
    update(dt);
    render();
    
    if(debugActive && frame % 30 === 0) updateDebug();
    
    requestAnimationFrame(loop);
  }catch(e){
    logError('LOOP', 'Критическая ошибка', e.message);
    setTimeout(() => requestAnimationFrame(loop), 100);
  }
}

// ============================================================
// 17. ЗАПУСК
// ============================================================
const map = new Map(12);
const player = new Player(5, 5);

try{
  resizeCanvas();
  resetStick();
  updateFireBtn();
  setupInput();
  
  let resizeTimeout = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(()=>{
      try{
        W = window.innerWidth;
        H = window.innerHeight;
        resizeCanvas();
        resetStick();
        updateFireBtn();
        if(debugActive) updateDebug();
      }catch(e){
        logError('RESIZE', 'Ошибка', e.message);
      }
    }, 150);
  });
  
  requestAnimationFrame(loop);
  console.log('🔥 Shuterok — готов!');
  console.log(`🗺️ Карта: ${map.size}×${map.size}`);
  console.log(`🎮 Игрок: (${player.x}, ${player.y})`);
  console.log('📱 Левая половина → движение, правая → обзор');
  console.log('🎯 Стик появляется под пальцем');
}catch(e){
  console.error('Критическая ошибка:', e);
  document.body.innerHTML = `<div style="color:#fff;padding:20px;font-family:monospace;background:#0a0c0f;min-height:100vh;">
    <h2 style="color:#ff4444;">❌ Ошибка запуска</h2>
    <p>${e.message}</p>
    <pre style="color:#8aaccc;font-size:12px;margin-top:12px;white-space:pre-wrap;">${e.stack}</pre>
  </div>`;
}
</script>
