<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Skeleton Shooter — fixed (final)</title>
<style>
  :root{ --hud-bg: rgba(0,0,0,0.36); --accent:#ffcc33; --text:#fff; }
  html,body{ height:100%; margin:0; padding:0; background:#0f0f10; font-family:system-ui, -apple-system, "Segoe UI", Roboto, Arial; color:var(--text); -webkit-font-smoothing:antialiased; }
  #game-wrap{ position:fixed; left:0; top:0; width:100%; height:100%; overflow:hidden; -webkit-tap-highlight-color: transparent; }
  canvas#game { display:block; width:100%; height:100%; touch-action:none; background:#222; }
  .hud{ position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; }
  .topbar{ display:flex; justify-content:space-between; align-items:center; padding:10px; pointer-events:auto; }
  .stat{ background:var(--hud-bg); padding:8px 12px; border-radius:12px; margin-right:8px; font-size:15px; color:var(--text); }
  .controls { position:absolute; left:0; right:0; bottom:18px; pointer-events:none; display:flex; justify-content:space-between; padding:12px; }
  .left-pad, .right-pad { pointer-events:auto; }
  .joystick { width:120px; height:120px; border-radius:999px; background:rgba(255,255,255,0.04); display:flex; align-items:center; justify-content:center; touch-action:none; }
  .joystick .thumb { width:44px; height:44px; border-radius:999px; background:rgba(255,255,255,0.16); transform:translate(0,0); transition:0.02s linear; }
  .fire-btn { width:72px; height:72px; border-radius:999px; background:rgba(0,0,0,0.55); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; pointer-events:auto; }
  #settingsBtn { pointer-events:auto; background:var(--hud-bg); padding:8px 12px; border-radius:12px; cursor:pointer; color:var(--text); }
  .hint { position:absolute; left:50%; transform:translateX(-50%); bottom:6px; background:rgba(0,0,0,0.35); padding:6px 10px; border-radius:8px; font-size:12px; pointer-events:none; white-space:nowrap; }
  #overlay { position:fixed; left:0; top:0; width:100%; height:100%; display:none; align-items:center; justify-content:center; z-index:1000; background:rgba(0,0,0,0.4); }
  #overlay.active { display:flex; pointer-events:auto; }
  .panel { width:90%; max-width:420px; background:#121212; color:#e6e6e6; border-radius:12px; padding:14px; box-shadow:0 8px 30px rgba(0,0,0,0.6); }
  .panel .btns{ display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
  .panel button{ padding:8px 12px; border-radius:8px; background:var(--hud-bg); color:var(--text); border:0; cursor:pointer; }
  @media (orientation:landscape){ .joystick{ width:100px;height:100px } .joystick .thumb{ width:36px;height:36px } .fire-btn{ width:60px;height:60px } }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game"></canvas>

  <div class="hud" aria-hidden="false">
    <div class="topbar">
      <div style="display:flex;align-items:center;">
        <div class="stat" id="hp">HP: 100</div>
        <div class="stat" id="lvl">LVL: 1</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div id="settingsBtn">⚙️ Настройки</div>
      </div>
    </div>

    <div class="controls">
      <div class="left-pad">
        <div id="joystick" class="joystick" aria-hidden="true"><div id="thumb" class="thumb"></div></div>
      </div>
      <div class="right-pad">
        <div style="display:flex;align-items:center;gap:12px;">
          <div id="fireBtn" class="fire-btn">FIRE</div>
        </div>
      </div>
    </div>

    <div class="hint">Левый джойстик — движение. Проводи правой частью экрана — поворот камеры.</div>
  </div>

  <div id="overlay" role="dialog" aria-modal="true">
    <div class="panel" id="settingsPanel">
      <h3 style="margin:0 0 8px 0;">Настройки</h3>
      <div style="display:flex;gap:8px;align-items:center;margin:8px 0;">
        <div style="min-width:120px;color:#cfcfcf;">Чувствительность</div>
        <input id="sens" type="range" min="0.4" max="1.8" step="0.05" value="1.0" style="flex:1;">
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin:8px 0;">
        <div style="min-width:120px;color:#cfcfcf;">Графика</div>
        <select id="gfx" style="flex:1;padding:8px;border-radius:8px;background:rgba(255,255,255,0.04);color:#fff;border:0;">
          <option value="High">High</option>
          <option value="Low">Low</option>
        </select>
      </div>
      <div class="btns"><button id="apply">Применить</button><button id="close">Закрыть</button></div>
    </div>
  </div>
</div>

<script>
/* FINAL fixed build
   - debugReset true: принудительный сброс localStorage при первом запуске (вы согласились)
   - минимальные console.log (можно включить больше вручную)
*/
const DEBUG_RESET_LOCALSTORAGE = true; // <-- сброс настроек один раз при загрузке
if (DEBUG_RESET_LOCALSTORAGE) try { localStorage.removeItem('skeleton_settings_v2'); } catch(e){}

const KEY = 'skeleton_settings_v2';
const defaultSettings = { lookSensitivity: 1.0, graphics: 'High' };
let settings = loadSettings();
function loadSettings(){ try{ return Object.assign({}, defaultSettings, JSON.parse(localStorage.getItem(KEY))||{}); }catch(e){ return Object.assign({}, defaultSettings); } }
function saveSettings(){ try{ localStorage.setItem(KEY, JSON.stringify(settings)); }catch(e){} }

let config = { mapSize:36, tileSize:64, fov: Math.PI/3, screenRayResolution:2, maxRenderDistance:20, ambientLight:0.15 };
function applyPreset(p){ if(p==='Low'){ config.screenRayResolution=3; config.maxRenderDistance=14; config.ambientLight=0.24; } else { config.screenRayResolution=2; config.maxRenderDistance=20; config.ambientLight=0.15; } }
applyPreset(settings.graphics);

/* utils */
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const rnd = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const randf = (a,b)=> a + Math.random()*(b-a);
const lerp = (a,b,t)=> a + (b-a)*t;

/* Dungeon */
class Dungeon {
  constructor(size){ this.size=size; this.grid=Array.from({length:size},()=>Array(size).fill(1)); this.rooms=[]; }
  carveRoom(x,y,w,h){ for(let i=x;i<x+w;i++) for(let j=y;j<y+h;j++) if(i>0&&j>0&&i<this.size-1&&j<this.size-1) this.grid[j][i]=0; this.rooms.push({x,y,w,h,cx:x+Math.floor(w/2),cy:y+Math.floor(h/2)}); }
  carveH(x1,x2,y){ for(let x=Math.min(x1,x2); x<=Math.max(x1,x2); x++) if(x>0&&x<this.size-1&&y>0&&y<this.size-1) this.grid[y][x]=0; }
  carveV(y1,y2,x){ for(let y=Math.min(y1,y2); y<=Math.max(y1,y2); y++) if(x>0&&x<this.size-1&&y>0&&y<this.size-1) this.grid[y][x]=0; }
  generate(){
    let attempts=30;
    while(attempts-- && this.rooms.length < 9){
      const w=rnd(3,7), h=rnd(3,7), x=rnd(1,this.size-w-2), y=rnd(1,this.size-h-2);
      let ok=true;
      for(let rx=x-1; rx<=x+w; rx++){ for(let ry=y-1; ry<=y+h; ry++){ if(rx<0||ry<0||rx>=this.size||ry>=this.size) continue; if(this.grid[ry][rx]===0){ ok=false; break; } } if(!ok) break; }
      if(ok) this.carveRoom(x,y,w,h);
    }
    if(this.rooms.length){
      const centers=this.rooms.map(r=>({x:r.cx,y:r.cy}));
      centers.sort((a,b)=>a.x-b.x);
      for(let i=1;i<centers.length;i++){
        const a=centers[i-1], b=centers[i];
        if(Math.random()<0.5){ this.carveH(a.x,b.x,a.y); this.carveV(a.y,b.y,b.x); } else { this.carveV(a.y,b.y,a.x); this.carveH(a.x,b.x,b.y); }
      }
    }
    for(let i=0;i<this.size;i++){ this.grid[0][i]=1; this.grid[this.size-1][i]=1; this.grid[i][0]=1; this.grid[i][this.size-1]=1; }
  }
  isWall(x,y){ if(x<0||y<0||x>=this.size||y>=this.size) return true; return this.grid[y][x]===1; }
  getRandomFloorInRoom(idx){ const r=this.rooms[idx]||this.rooms[0]||{x:2,y:2,w:3,h:3}; const x=rnd(r.x, r.x+r.w-1); const y=rnd(r.y, r.y+r.h-1); return {x,y}; }
}

/* Entities */
class Player { constructor(x,y,a){ this.x=x+0.5; this.y=y+0.5; this.angle=a||0; this.speed=2.6; this.hp=100; this.level=1; this.recoil=0; } }
class Enemy { constructor(x,y){ this.x=x+0.5; this.y=y+0.5; this.hp=12; this.speed=1.2; this.dead=false; this._flinch=0; this._wanderTarget=null; } }
class Projectile { constructor(){ this.alive=false; } spawn(x,y,vx,vy){ this.alive=true; this.x=x; this.y=y; this.px=x; this.py=y; this.vx=vx; this.vy=vy; this.life=0; } }

/* Renderer */
class Renderer {
  constructor(canvas){
    this.canvas = canvas; this.ctx = canvas.getContext('2d'); this.dpr = Math.max(1, Math.min(window.devicePixelRatio||1, 2));
    this.renderW = 0; this.renderH = 0; this.resize();
  }
  resize(){
    const rect = this.canvas.getBoundingClientRect();
    this.renderW = Math.max(1, Math.floor(rect.width));
    this.renderH = Math.max(1, Math.floor(rect.height));
    this.canvas.width = Math.floor(this.renderW * this.dpr);
    this.canvas.height = Math.floor(this.renderH * this.dpr);
    this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
  }
  clear(){ this.ctx.fillStyle='#111'; this.ctx.fillRect(0,0,this.renderW,this.renderH); }
  worldToScreenX(player,wx,wy){
    const dx = wx - player.x, dy = wy - player.y;
    const ang = Math.atan2(dy,dx);
    let delta = ang - player.angle; while(delta < -Math.PI) delta += Math.PI*2; while(delta > Math.PI) delta -= Math.PI*2;
    if(Math.abs(delta) > config.fov/2 + 0.6) return null;
    const screenX = Math.tan(delta) * (this.renderW/2) / Math.tan(config.fov/2) + (this.renderW/2);
    return { screenX, distance: Math.hypot(dx,dy) };
  }
  render(state){
    if(this.renderW <= 0 || this.renderH <= 0) return;
    const ctx = this.ctx, player = state.player, map = state.map, enemies = state.enemies;
    this.clear();
    const w = this.renderW, h = this.renderH, half = h/2;
    // sky/floor
    const sky = ctx.createLinearGradient(0,0,0,half); sky.addColorStop(0,'#2b2b50'); sky.addColorStop(1,'#1d1d2a'); ctx.fillStyle = sky; ctx.fillRect(0,0,w,half);
    const floor = ctx.createLinearGradient(0,half,0,h); floor.addColorStop(0,'#343434'); floor.addColorStop(1,'#555'); ctx.fillStyle = floor; ctx.fillRect(0,half,w,half);
    // walls (simple ray)
    const step = config.screenRayResolution;
    const rays = Math.max(40, Math.floor(w/step));
    const angleStart = player.angle - config.fov/2;
    for(let r=0, sx=0; r<rays; r++, sx+=step){
      const rayAngle = angleStart + (r/rays)*config.fov;
      const cos = Math.cos(rayAngle), sin = Math.sin(rayAngle);
      let dist=0, hit=false;
      while(!hit && dist < config.maxRenderDistance){ dist += 0.06; const rx=player.x+cos*dist, ry=player.y+sin*dist; if(map.isWall(Math.floor(rx),Math.floor(ry))){ hit=true; break; } }
      if(!hit) continue;
      const corr = dist * Math.cos(rayAngle - player.angle - player.recoil);
      const height = clamp((config.tileSize*(h/2)) / (corr*config.tileSize), 0, h*2);
      const shade = clamp((1 - corr/(config.maxRenderDistance*0.9)) + config.ambientLight, 0.12, 1);
      const base = 140;
      ctx.fillStyle = `rgba(${Math.floor(base*shade)},${Math.floor(base*shade*0.8)},${Math.floor(base*shade*0.6)},1)`;
      ctx.fillRect(sx, half - height/2, step+1, height);
    }
    // enemies
    for(const e of enemies){
      if(e.dead) continue;
      const pos = this.worldToScreenX(player, e.x, e.y);
      if(!pos) continue;
      // simple occlusion: check midpoint
      const midx = player.x + (e.x - player.x) * 0.5, midy = player.y + (e.y - player.y) * 0.5;
      if(map.isWall(Math.floor(midx), Math.floor(midy))) continue;
      const size = clamp((config.tileSize*(h/2)) / (pos.distance*config.tileSize), 8, h*0.8);
      ctx.fillStyle='rgba(200,80,80,1)'; ctx.beginPath(); ctx.ellipse(pos.screenX, half, size*0.45, size*0.45, 0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(pos.screenX-size/2, half - size/2 - 10, size, 6);
      ctx.fillStyle='rgba(0,220,0,0.9)'; ctx.fillRect(pos.screenX-size/2, half - size/2 - 10, size * clamp(e.hp/12,0,1), 6);
    }
    // projectiles
    for(const p of state.projectiles){
      if(!p.alive) continue;
      const prev = this.worldToScreenX(player, p.px, p.py);
      const curr = this.worldToScreenX(player, p.x, p.y);
      if(prev && curr){ ctx.strokeStyle='rgba(255,255,255,0.95)'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(prev.screenX, half-6); ctx.lineTo(curr.screenX, half-6); ctx.stroke(); }
    }
    // minimap
    const ms = Math.min(120, Math.floor(Math.min(w,h)*0.22)); const off=8; const cell = ms / map.size;
    ctx.globalAlpha = 0.95; ctx.fillStyle='#000'; ctx.fillRect(off, off, ms+4, ms+4);
    for(let yy=0; yy<map.size; yy++) for(let xx=0; xx<map.size; xx++){ ctx.fillStyle = map.grid[yy][xx] ? '#222' : '#666'; ctx.fillRect(off+2 + xx*cell, off+2 + yy*cell, cell, cell); }
    ctx.fillStyle='#00ffcc'; ctx.fillRect(off+2 + (player.x-0.5)*cell - 2, off+2 + (player.y-0.5)*cell - 2, 4, 4);
    ctx.globalAlpha = 1;
    this.drawCrosshair(); this.drawWeaponHUD(state.player);
  }
  drawCrosshair(){ const ctx=this.ctx, cx=this.renderW/2, cy=this.renderH/2; ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.beginPath(); ctx.arc(cx,cy,2.2,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(cx,cy,8,0,Math.PI*2); ctx.stroke(); ctx.restore(); }
  drawWeaponHUD(player){ const ctx=this.ctx, w=this.renderW, h=this.renderH; const cx=w/2, baseY = h - Math.min(160, Math.floor(h*0.28)); ctx.save(); const t=performance.now()/1000, bobX=Math.sin(t*1.8)*0.6, bobY=Math.abs(Math.sin(t*1.2))*0.6; ctx.translate(cx + bobX*2, baseY + bobY); ctx.fillStyle='#6f7278'; ctx.beginPath(); ctx.roundRect(-120,-20,240,44,8); ctx.fill(); ctx.fillStyle='#222'; ctx.fillRect(110,-8,28,16); const flash = clamp(Math.abs(player.recoil)*30,0,1); if(flash>0.02){ ctx.save(); ctx.globalAlpha=flash; const mx=130,my=0; const g=ctx.createRadialGradient(mx,my,0,mx,my,32); g.addColorStop(0,'rgba(255,230,150,0.9)'); g.addColorStop(1,'rgba(255,120,20,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(mx,my,32,0,Math.PI*2); ctx.fill(); ctx.restore(); } this._muzzle = { x: cx + bobX*2 + 130, y: baseY + bobY }; ctx.restore(); }
}
CanvasRenderingContext2D.prototype.roundRect = CanvasRenderingContext2D.prototype.roundRect || function(x,y,w,h,r){ if(w<2*r) r=w/2; if(h<2*r) r=h/2; this.beginPath(); this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r); this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); return this; };

/* Game */
class Game {
  constructor(canvas){
    this.canvas = canvas; this.renderer = new Renderer(canvas);
    this.setup(); this.last = 0; this.running = true;
    this.bind(); requestAnimationFrame(this.loop.bind(this));
  }
  setup(){
    this.dungeon = new Dungeon(config.mapSize); this.dungeon.generate();
    const start = this.dungeon.rooms[0] || {cx:4,cy:4};
    this.player = new Player(start.cx, start.cy, randf(0,Math.PI*2));
    this.enemies = []; for(let i=0;i<8;i++){ const r = Math.max(0, Math.min(this.dungeon.rooms.length-1, i)); const p = this.dungeon.getRandomFloorInRoom(r); this.enemies.push(new Enemy(p.x,p.y)); }
    this.projectiles = Array.from({length:48}, ()=>new Projectile());
    this.state = { map:this.dungeon, player:this.player, enemies:this.enemies, projectiles:this.projectiles };
    this.input = { moveX:0, moveY:0, lookDX:0, shooting:false };
    this.hpEl = document.getElementById('hp'); this.lvlEl = document.getElementById('lvl');
  }
  bind(){
    window.addEventListener('resize', ()=>{ this.renderer.resize(); });
    // joystick
    const joy = document.getElementById('joystick'), thumb = document.getElementById('thumb');
    let joyId = null, joyOrigin = null;
    joy.addEventListener('pointerdown', (e)=>{ e.preventDefault(); if(joyId!==null) return; joyId=e.pointerId; joyOrigin={x:e.clientX,y:e.clientY}; joy.setPointerCapture(joyId); thumb.style.transition='0.02s'; });
    joy.addEventListener('pointermove', (e)=>{ if(e.pointerId!==joyId) return; const dx=e.clientX-joyOrigin.x, dy=e.clientY-joyOrigin.y, max=joy.clientWidth/2; const dist=Math.hypot(dx,dy), ang=Math.atan2(dy,dx); const clamped = dist>max ? {x:Math.cos(ang)*max, y:Math.sin(ang)*max} : {x:dx,y:dy}; thumb.style.transform=`translate(${clamped.x}px,${clamped.y}px)`; this.input.moveY = -clamped.y/max; this.input.moveX = clamped.x/max; });
    const joyUp = (e)=>{ if(e.pointerId!==joyId) return; try{ joy.releasePointerCapture(joyId); }catch(_); joyId=null; joyOrigin=null; thumb.style.transition='0.15s'; thumb.style.transform='translate(0,0)'; this.input.moveX=0; this.input.moveY=0; };
    joy.addEventListener('pointerup', joyUp); joy.addEventListener('pointercancel', joyUp);

    // fire button
    const fire = document.getElementById('fireBtn');
    let fireId = null;
    fire.addEventListener('pointerdown', (e)=>{ e.preventDefault(); if(fireId!==null) return; fireId=e.pointerId; this.input.shooting=true; try{ fire.setPointerCapture(fireId); }catch(_){}} );
    const fireUp = (e)=>{ if(e.pointerId!==fireId) return; try{ fire.releasePointerCapture(fireId); }catch(_); fireId=null; this.input.shooting=false; };
    fire.addEventListener('pointerup', fireUp); fire.addEventListener('pointercancel', fireUp);

    // look (right half). ignore UI targets
    let lookId = null, lastX = 0;
    this.canvas.addEventListener('pointerdown', (e)=>{
      if(e.target && e.target.closest && (e.target.closest('#joystick') || e.target.closest('#fireBtn') || e.target.closest('#settingsBtn'))) return;
      if(e.clientX < window.innerWidth * 0.45) return;
      if(joyId === e.pointerId || fireId === e.pointerId) return;
      lookId = e.pointerId; lastX = e.clientX; try{ this.canvas.setPointerCapture(lookId); }catch(_){}
    });
    this.canvas.addEventListener('pointermove', (e)=>{ if(e.pointerId !== lookId) return; const dx = e.clientX - lastX; lastX = e.clientX; const base = 0.004 * (window.innerWidth / 360); this.input.lookDX = dx * base * settings.lookSensitivity; });
    this.canvas.addEventListener('pointerup', (e)=>{ if(e.pointerId !== lookId) return; lookId=null; this.input.lookDX=0; try{ this.canvas.releasePointerCapture(e.pointerId); }catch(_){ } });
    this.canvas.addEventListener('pointercancel', (e)=>{ if(e.pointerId !== lookId) return; lookId=null; this.input.lookDX=0; try{ this.canvas.releasePointerCapture(e.pointerId); }catch(_){ } });

    // settings
    document.getElementById('settingsBtn').addEventListener('click', (ev)=>{ ev.preventDefault(); ev.stopPropagation(); openPanel(); });
    document.getElementById('close').addEventListener('click', (ev)=>{ ev.preventDefault(); closePanel(); });
    document.getElementById('apply').addEventListener('click', (ev)=>{ ev.preventDefault(); settings.lookSensitivity = parseFloat(document.getElementById('sens').value); settings.graphics = document.getElementById('gfx').value; saveSettings(); applyPreset(settings.graphics); this.renderer.resize(); closePanel(); });
    document.getElementById('sens').value = settings.lookSensitivity;
    document.getElementById('gfx').value = settings.graphics;
  }
  loop(ts){
    const dt = this.last ? Math.min(0.06, (ts - this.last)/1000) : 0.016; this.last = ts;
    if(this.running) this.update(dt);
    this.renderer.render(this.state);
    requestAnimationFrame(this.loop.bind(this));
  }
  update(dt){
    const p = this.player;
    const forward = this.input.moveY, strafe = this.input.moveX;
    const mv = p.speed * dt;
    const dx = Math.cos(p.angle)*forward*mv - Math.sin(p.angle)*strafe*mv;
    const dy = Math.sin(p.angle)*forward*mv + Math.cos(p.angle)*strafe*mv;
    this.moveEntity(p, dx, dy);
    p.angle += this.input.lookDX;
    this.input.lookDX = this.input.lookDX * Math.exp(-dt*12);
    this.handleShooting(dt);
    this.updateProjectiles(dt);
    this.updateEnemies(dt);
    this.hpEl.textContent = 'HP: ' + Math.max(0, Math.floor(p.hp));
    this.lvlEl.textContent = 'LVL: ' + p.level;
  }
  handleShooting(dt){
    if(!this.input.shooting){ this.player.recoil = lerp(this.player.recoil, 0, dt*8); return; }
    this._fireCooldown = (this._fireCooldown||0) - dt; if(this._fireCooldown>0) return;
    this._fireCooldown = 0.16;
    const ang = this.player.angle + randf(-0.004,0.004);
    const speed = 14; const vx = Math.cos(ang)*speed, vy = Math.sin(ang)*speed;
    const mx = this.player.x + Math.cos(this.player.angle)*0.36; const my = this.player.y + Math.sin(this.player.angle)*0.36;
    for(const pr of this.projectiles){ if(!pr.alive){ pr.spawn(mx,my,vx,vy); break; } }
    this.player.recoil = -0.012 + randf(-0.003,0.003);
  }
  updateProjectiles(dt){
    for(const pr of this.projectiles){
      if(!pr.alive) continue;
      pr.px = pr.x; pr.py = pr.y; const nx = pr.x + pr.vx*dt, ny = pr.y + pr.vy*dt;
      const steps = Math.max(1, Math.ceil(Math.hypot(nx-pr.x, ny-pr.y)/0.06)); let collided=false;
      for(let s=1;s<=steps;s++){
        const t = s/steps; const sx = pr.x + (nx-pr.x)*t, sy = pr.y + (ny-pr.y)*t;
        for(const e of this.enemies){ if(e.dead) continue; if(Math.hypot(sx-e.x, sy-e.y) < 0.45){ e.hp -= 6; e._flinch = 0.18; if(e.hp<=0) e.dead=true; collided=true; break; } }
        if(collided) break;
        if(this.dungeon.isWall(Math.floor(sx), Math.floor(sy))){ collided=true; break; }
      }
      if(collided) pr.alive=false; else { pr.x = nx; pr.y = ny; pr.life += dt; if(pr.life>1.6) pr.alive=false; }
    }
  }
  updateEnemies(dt){
    for(const e of this.enemies){
      if(e.dead) continue;
      if(e._flinch>0){ e._flinch -= dt; continue; }
      const dx = this.player.x - e.x, dy = this.player.y - e.y; const dist = Math.hypot(dx,dy);
      if(dist > 6){
        // wander: set or move to wander target
        if(!e._wanderTarget || Math.hypot(e._wanderTarget.x - e.x, e._wanderTarget.y - e.y) < 0.4) e._wanderTarget = { x: e.x + randf(-2,2), y: e.y + randf(-2,2) };
        const wx = e._wanderTarget.x - e.x, wy = e._wanderTarget.y - e.y; const wl = Math.hypot(wx,wy) || 1;
        this.moveEntity(e, (wx/wl) * e.speed * 0.35 * dt, (wy/wl) * e.speed * 0.35 * dt);
      } else {
        const dirx = dx/dist, diry = dy/dist; this.moveEntity(e, dirx*e.speed*dt, diry*e.speed*dt);
        if(dist < 0.6){ this.player.hp = Math.max(0, this.player.hp - dt*10); if(this.player.hp<=0) this.running=false; }
      }
    }
  }
  moveEntity(ent, dx, dy){
    const collide = (x,y)=> this.dungeon.isWall(Math.floor(x), Math.floor(y));
    const newX = ent.x + dx, newY = ent.y + dy; const r = 0.28;
    if(!collide(newX-r,newY-r) && !collide(newX+r,newY-r) && !collide(newX-r,newY+r) && !collide(newX+r,newY+r)){ ent.x=newX; ent.y=newY; return; }
    // try axis moves
    if(!collide(ent.x+dx-r, ent.y-r) && !collide(ent.x+dx+r, ent.y-r) && !collide(ent.x+dx-r, ent.y+r) && !collide(ent.x+dx+r, ent.y+r)) ent.x += dx;
    else if(!collide(ent.x-r, ent.y+dy-r) && !collide(ent.x+r, ent.y+dy-r) && !collide(ent.x-r, ent.y+dy+r) && !collide(ent.x+r, ent.y+dy+r)) ent.y += dy;
  }
}

/* Panel helpers */
const overlay = document.getElementById('overlay');
function openPanel(){ overlay.classList.add('active'); if(window.game) window.game.running=false; }
function closePanel(){ overlay.classList.remove('active'); if(window.game) window.game.running=true; }

/* Init after DOM ready */
document.addEventListener('DOMContentLoaded', ()=>{
  const canvas = document.getElementById('game');
  if(!canvas){ console.error('Canvas not found'); return; }
  function fit(){ const wrap = document.getElementById('game-wrap'); canvas.style.width = wrap.clientWidth + 'px'; canvas.style.height = wrap.clientHeight + 'px'; if(window.game && window.game.renderer) window.game.renderer.resize(); }
  fit(); window.addEventListener('resize', fit);
  const game = new Game(canvas);
  window.game = game;
  // ensure preset saved
  applyPreset(settings.graphics); saveSettings();
  console.log('Game initialized (final). Если пустой экран — попробуйте открыть в мобильном Chrome и посмотреть консоль.');
});
